AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  A complete RapidMX mail server on one EC2 instance: k3s with the AWS cloud controller and EBS CSI driver, Envoy Gateway
  behind a Classic Load Balancer, cert-manager with Let's Encrypt, and the RapidMX server chart sending mail through SES.
  The instance's user data runs deploy/aws/bootstrap.sh from this repository.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Server
        Parameters:
          - Domain
          - MailHost
          - AuthHost
          - AcmeEmail
          - HostedZoneId
          - ChartVersion
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - VolumeSize
          - KeyName
          - LatestAmiId
      - Label:
          default: Network
        Parameters:
          - VpcId
          - SubnetId
          - AllowedWebCidr
          - AllowedSshCidr
      - Label:
          default: Advanced
        Parameters:
          - EnableOpenBao
          - ClusterName
          - BootstrapUrl
    ParameterLabels:
      Domain:
        default: Public host name of the server
      HostedZoneId:
        default: Route 53 hosted zone (optional)

Parameters:
  Domain:
    Type: String
    Description: >-
      The mail domain, e.g. example.com. The server is served at mail.<domain>, the auth-server at auth.<domain> (both
      CNAMEs to the load balancer), and mail is addressed @<domain>.
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    ConstraintDescription: must be a domain such as example.com.
  AcmeEmail:
    Type: String
    Description: Let's Encrypt account email for the certificates. Defaults to admin@<domain>.
    Default: ''
  HostedZoneId:
    Type: String
    Description: >-
      Optional. A Route 53 hosted zone for <domain>, which the instance writes the mail and auth records into, so the
      certificates can be issued on first boot. Left empty, point those records at the load balancer yourself.
    Default: ''
  MailHost:
    Type: String
    Description: The server's label within the domain, i.e. <this>.<domain>.
    Default: mail
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: must be a single host label such as mail.
  AuthHost:
    Type: String
    Description: The auth-server's label within the domain, i.e. <this>.<domain>.
    Default: auth
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: must be a single host label such as auth.
  ChartVersion:
    Type: String
    Description: The version of the RapidMX server Helm chart to install.
    Default: 1.0.0-beta.3
  InstanceType:
    Type: String
    Description: >-
      The server, auth-server, MongoDB, Redis, rspamd and ClamAV all run on this one instance; 8 GiB of memory is the
      practical minimum.
    Default: t3.large
    # x86_64 only, matching the default AMI parameter.
    AllowedValues: [t3.large, t3.xlarge, t3a.large, t3a.xlarge, m6i.large, m6i.xlarge, m6a.large, m6a.xlarge]
  VolumeSize:
    Type: Number
    Description: Size of the instance's root volume in GiB (message storage uses separate EBS volumes).
    Default: 60
    MinValue: 30
    MaxValue: 16000
  KeyName:
    Type: String
    Description: Optional EC2 key pair for SSH. Without one, use Session Manager (the instance has the SSM role).
    Default: ''
  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Description: Amazon Linux 2023 AMI (resolved from the public SSM parameter).
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  VpcId:
    Type: String
    Description: >-
      Optional. An existing VPC to launch into; its subnet must be public and tagged kubernetes.io/role/elb=1. Left
      empty, this stack creates a VPC, public subnet and internet gateway with the right tags.
    Default: ''
  SubnetId:
    Type: String
    Description: Optional. A public subnet in that VPC. Required when VpcId is set.
    Default: ''
  AllowedWebCidr:
    Type: String
    Description: Where HTTP and HTTPS may be reached from.
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  AllowedSshCidr:
    Type: String
    Description: Optional. Where SSH may be reached from. Empty opens no SSH port at all.
    Default: ''
  EnableOpenBao:
    Type: String
    Description: >-
      Installs OpenBao on the instance and keeps the deployment's secrets - the JWT, cookie, session, escrow audit and
      mail ingest secrets - and the certificate authority for end-to-end encrypted mail in it. "false" keeps them in
      Kubernetes Secrets instead.
    Default: 'true'
    AllowedValues: ['true', 'false']
  ClusterName:
    Type: String
    Description: The kubernetes.io/cluster/<name> tag the cloud controller identifies this cluster's resources by.
    Default: rapidmx
    AllowedPattern: '^[a-zA-Z0-9][-a-zA-Z0-9]*$'
  BootstrapUrl:
    Type: String
    Description: >-
      The install script the instance downloads and runs. Pin it to a release tag once one contains deploy/aws (this
      default tracks main, so a stack created now installs whatever main says then).
    Default: https://raw.githubusercontent.com/rapidmx/server/main/deploy/aws/bootstrap.sh

Conditions:
  CreateNetwork: !Equals [!Ref VpcId, '']
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]
  HasSsh: !Not [!Equals [!Ref AllowedSshCidr, '']]
  HasHostedZone: !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  # --- Network (only when no VpcId was given) ---------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Condition: CreateNetwork
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      # The cloud controller looks the instance up by its private DNS name, which needs DNS host names on.
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: shared

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateNetwork
    Properties:
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        # Both tags are what the cloud controller looks for when it places a load balancer.
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: shared
        - Key: kubernetes.io/role/elb
          Value: '1'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateNetwork
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName

  PublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateNetwork
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateNetwork
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  # --- Instance ---------------------------------------------------------------------------------
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'RapidMX server (${AWS::StackName})'
      VpcId: !If [CreateNetwork, !Ref Vpc, !Ref VpcId]
      SecurityGroupIngress:
        - !If
          - HasSsh
          - IpProtocol: tcp
            FromPort: 22
            ToPort: 22
            CidrIp: !Ref AllowedSshCidr
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        # The cloud controller finds this group by the tag and adds the load balancer's rules to it, so the node ports
        # the load balancer forwards to are reachable from the load balancer only.
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: owned

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager, so the instance needs no SSH key or open port 22.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        # Everything the EBS CSI driver does with volumes and snapshots.
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
      Policies:
        - PolicyName: cloud-controller
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # https://cloud-provider-aws.sigs.k8s.io/prerequisites/ - the load balancer half of that policy; the
              # volume half is the managed EBS policy above.
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeTags
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceTopology
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeLoadBalancerPolicies
                  - kms:DescribeKey
                Resource: '*'
              - Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:DeleteSecurityGroup
                  - ec2:ModifyInstanceAttribute
                  - elasticloadbalancing:CreateLoadBalancer
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:ModifyLoadBalancerAttributes
                  - elasticloadbalancing:ApplySecurityGroupsToLoadBalancer
                  - elasticloadbalancing:AttachLoadBalancerToSubnets
                  - elasticloadbalancing:DetachLoadBalancerFromSubnets
                  - elasticloadbalancing:ConfigureHealthCheck
                  - elasticloadbalancing:CreateLoadBalancerListeners
                  - elasticloadbalancing:DeleteLoadBalancerListeners
                  - elasticloadbalancing:CreateLoadBalancerPolicy
                  - elasticloadbalancing:SetLoadBalancerPoliciesOfListener
                  - elasticloadbalancing:SetLoadBalancerPoliciesForBackendServer
                  - elasticloadbalancing:RegisterInstancesWithLoadBalancer
                  - elasticloadbalancing:DeregisterInstancesFromLoadBalancer
                  - elasticloadbalancing:AddTags
                  - iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
        - PolicyName: ses-send
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Outbound mail (SesMailTransport). Inbound is ses-bridge's own stack, with its own role.
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: '*'
        - !If
          - HasHostedZone
          - PolicyName: route53-records
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: route53:ChangeResourceRecordSets
                  Resource: !Sub 'arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}'
                - Effect: Allow
                  Action:
                    - route53:GetChange
                    - route53:ListHostedZones
                  Resource: '*'
          - !Ref AWS::NoValue

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  Instance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        # The whole install - k3s, the charts, a load balancer and a Let's Encrypt certificate - inside this window.
        Timeout: PT45M
        Count: 1
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref AWS::NoValue]
      SubnetId: !If [CreateNetwork, !Ref PublicSubnet, !Ref SubnetId]
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        # The cloud controller only manages instances carrying its cluster's tag.
        - Key: !Sub 'kubernetes.io/cluster/${ClusterName}'
          Value: owned
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -o pipefail
          exec > >(tee -a /var/log/rapidmx-install.log) 2>&1

          export RAPIDMX_DOMAIN='${Domain}'
          export RAPIDMX_ACME_EMAIL='${AcmeEmail}'
          export RAPIDMX_HOSTED_ZONE_ID='${HostedZoneId}'
          export RAPIDMX_CHART_VERSION='${ChartVersion}'
          export RAPIDMX_MAIL_HOST='${MailHost}'
          export RAPIDMX_AUTH_HOST='${AuthHost}'
          export RAPIDMX_CLUSTER_NAME='${ClusterName}'
          export RAPIDMX_OPENBAO='${EnableOpenBao}'
          export RAPIDMX_WEB_CIDRS='${AllowedWebCidr}'

          status=0
          curl -fsSL '${BootstrapUrl}' -o /root/rapidmx-bootstrap.sh && bash /root/rapidmx-bootstrap.sh || status=$?

          # Tells CloudFormation whether the stack finished, so a failed install fails the stack instead of leaving a
          # half-installed instance behind.
          dnf install -y aws-cfn-bootstrap >/dev/null 2>&1 || true
          if [ -x /opt/aws/bin/cfn-signal ]; then
            /opt/aws/bin/cfn-signal --exit-code $status --stack '${AWS::StackName}' --resource Instance --region '${AWS::Region}'
          fi
          exit $status

Outputs:
  Address:
    Description: The webmail address, once its DNS record points at the load balancer.
    Value: !Sub 'https://${MailHost}.${Domain}'
  SignInAddress:
    Description: The auth-server address (sign-in redirects here).
    Value: !Sub 'https://${AuthHost}.${Domain}'
  InstanceId:
    Description: The instance running the server.
    Value: !Ref Instance
  SummaryCommand:
    Description: >-
      Prints the install summary, including the load balancer's name, the generated secrets and the ses-bridge command.
    Value: !Sub >-
      aws ssm start-session --target ${Instance} --region ${AWS::Region} --document-name AWS-StartInteractiveCommand
      --parameters command='sudo cat /var/lib/rapidmx-installer/summary.txt'
  DnsRecords:
    Description: The records to create when no hosted zone was given (both CNAMEs to the load balancer).
    Value: !If
      - HasHostedZone
      - Created in the given hosted zone.
      - !Sub 'CNAME ${MailHost}.${Domain} and ${AuthHost}.${Domain} to the load balancer in the summary.'
  VpcId:
    Description: The VPC the instance runs in.
    Value: !If [CreateNetwork, !Ref Vpc, !Ref VpcId]
