apiVersion: v2
description: >-
  Installs the RapidMX mail server - webmail, ActiveSync, MAPI, and Autodiscover
  - along with its supporting auth-server and rspamd/ClamAV spam/AV scanning
  into a Kubernetes cluster, with the inbound/outbound MTA (Postfix and
  postfix-bridge, https://github.com/rapidmx/postfix-bridge) as a dependency.
name: server
version: 1.0.0
appVersion: 1.0.0-beta.7
dependencies:
  - name: mongodb
    repository: '@bitnami'
    version: ~18.4.4
    condition: mongodb.create
    tags:
      - dbs
      - mongodb
    alias: mongodb
  - name: postgresql
    repository: '@bitnami'
    version: ~18.8.13
    condition: postgresql.create
    tags:
      - dbs
      - postgresql
    alias: postgresql
  - name: redis
    version: ~24.1.3
    repository: '@bitnami'
    condition: redis.create
    tags:
      - cache
      - redis
    alias: redis
  - name: auth-server
    repository: oci://ghcr.io/rapidrest/charts
    version: 1.0.0-beta.13
    condition: authserver.create
    alias: authserver
  - name: postfix-bridge
    repository: oci://ghcr.io/rapidmx/charts
    version: 1.4.0
    condition: postfixBridge.create
    alias: postfixBridge
