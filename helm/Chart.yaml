apiVersion: v2
description: >-
  Installs the RapidMX mail server - webmail, ActiveSync, MAPI, and Autodiscover
  - along with its supporting auth-server and rspamd/ClamAV spam/AV scanning
  into a Kubernetes cluster. Real inbound/outbound MTA (Postfix + postfix-bridge)
  is a separate chart - see https://github.com/rapidmx/postfix-bridge - deploy it
  alongside this one, not instead of it.
name: server
version: 1.0.0
appVersion: 1.0.0-beta.2
dependencies:
  - name: mongodb
    repository: '@bitnami'
    version: ~18.4.4
    condition: mongodb.create
    tags:
      - dbs
      - mongodb
    alias: mongodb
  - name: postgresql
    repository: '@bitnami'
    version: ~18.8.13
    condition: postgresql.create
    tags:
      - dbs
      - postgresql
    alias: postgresql
  - name: redis
    version: ~24.1.3
    repository: '@bitnami'
    condition: redis.create
    tags:
      - cache
      - redis
    alias: redis
  - name: auth-server
    repository: oci://ghcr.io/rapidrest/charts
    version: 1.0.0-beta.2
    condition: authServer.create
    alias: authServer
