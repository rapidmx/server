---
# Cookie, session and escrow audit signing secrets. Kept in a Secret (not the ConfigMap) and generated only once: an empty
# cookies.secret/sessions.secret/mail.escrow.auditHmacKey gets a random value on install that later upgrades read back
# from this Secret, so signed cookies and sessions stay valid and the escrow audit chain keeps verifying across upgrades,
# and every replica shares the same values. An explicit value always wins. With secrets.existingSecret, that Secret is
# used instead and nothing is rendered here.
{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-service-secrets" (include "rrst.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $stored := (get $existing "data") | default dict }}
{{- $generated := list }}
{{- range $key, $value := dict "cookies.secret" .Values.cookies.secret "sessions.secret" .Values.sessions.secret "mail.escrow.auditHmacKey" .Values.mail.escrow.auditHmacKey }}
{{- if not $value }}
{{- $generated = append $generated $key }}
{{- end }}
{{- end }}
{{- include "server.assertStableSecrets" (dict "missing" $generated "context" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  cookie_secret: {{ include "server.persistedSecret" (dict "value" .Values.cookies.secret "stored" (get $stored "cookie_secret") "context" .) | quote }}
  session__secret: {{ include "server.persistedSecret" (dict "value" .Values.sessions.secret "stored" (get $stored "session__secret") "context" .) | quote }}
  # mail:escrow:audit_hmac_key - keys the escrow audit log's hash chain (HMAC-SHA256). Must be identical on every replica
  # and never change: entries chained under an old key no longer verify.
  mail__escrow__audit_hmac_key: {{ include "server.persistedSecret" (dict "value" .Values.mail.escrow.auditHmacKey "stored" (get $stored "mail__escrow__audit_hmac_key") "context" .) | quote }}
{{- end }}
