---
# Cookie, session and escrow audit signing secrets. Kept in a Secret (not the ConfigMap) and generated only once: an empty
# cookies.secret/sessions.secret/mail.escrow.auditHmacKey gets a random value on install that later upgrades read back
# from this Secret, so signed cookies and sessions stay valid and the escrow audit chain keeps verifying across upgrades,
# and every replica shares the same values. An explicit value always wins. With secrets.existingSecret, that Secret is
# used instead and nothing is rendered here.
#
# A value set under service.config (cookie_secret, session__secret, mail__escrow__audit_hmac_key) counts as explicit too:
# this Secret is a later envFrom source than the ConfigMap, so a generated value here would silently override it (and an
# upgrade would re-key the escrow audit chain). The dedicated value (cookies.secret etc.) wins when both are set.
{{- if not .Values.secrets.existingSecret }}
{{- $name := printf "%s-service-secrets" (include "rrst.fullname" .) }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $stored := (get $existing "data") | default dict }}
{{- $config := .Values.service.config | default dict }}
{{- $explicit := dict }}
{{- $generated := list }}
{{- range $key, $spec := dict "cookie_secret" (list "cookies.secret" .Values.cookies.secret) "session__secret" (list "sessions.secret" .Values.sessions.secret) "mail__escrow__audit_hmac_key" (list "mail.escrow.auditHmacKey" .Values.mail.escrow.auditHmacKey) }}
{{- $value := index $spec 1 | default "" | toString }}
{{- if and (not $value) (hasKey $config $key) }}
{{- $value = index $config $key | default "" | toString }}
{{- end }}
{{- $_ := set $explicit $key $value }}
{{- if not (tpl $value $) }}
{{- $generated = append $generated (index $spec 0) }}
{{- end }}
{{- end }}
{{- include "server.assertStableSecrets" (dict "missing" $generated "context" .) }}
{{- /*
The escrow audit HMAC key must never change silently: entries chained under the stored key stop verifying. A release that
set service.config.mail__escrow__audit_hmac_key while chart versions before the service.config precedence fix let the
generated value in this Secret win actually ran on the stored key, so an explicit value that differs from the stored one
fails the render instead of re-keying the chain on upgrade.
*/}}
{{- $storedAuditKey := get $stored "mail__escrow__audit_hmac_key" }}
{{- $explicitAuditKey := tpl (get $explicit "mail__escrow__audit_hmac_key") . }}
{{- if and $storedAuditKey $explicitAuditKey (ne ($explicitAuditKey | b64enc) $storedAuditKey) }}
{{- fail (printf "The escrow audit HMAC key you set (mail.escrow.auditHmacKey or service.config.mail__escrow__audit_hmac_key) differs from the one stored in Secret %s/%s, which this release has been chaining the escrow audit log with; changing it breaks audit verification. To keep the stored key, set mail.escrow.auditHmacKey to it (kubectl -n %s get secret %s -o jsonpath='{.data.mail__escrow__audit_hmac_key}' | base64 -d) and remove the other value. To rotate on purpose, first remove the mail__escrow__audit_hmac_key key from that Secret." .Release.Namespace $name .Release.Namespace $name) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  cookie_secret: {{ include "server.persistedSecret" (dict "value" (get $explicit "cookie_secret") "stored" (get $stored "cookie_secret") "context" .) | quote }}
  session__secret: {{ include "server.persistedSecret" (dict "value" (get $explicit "session__secret") "stored" (get $stored "session__secret") "context" .) | quote }}
  # mail:escrow:audit_hmac_key - keys the escrow audit log's hash chain (HMAC-SHA256). Must be identical on every replica
  # and never change: entries chained under an old key no longer verify.
  mail__escrow__audit_hmac_key: {{ include "server.persistedSecret" (dict "value" (get $explicit "mail__escrow__audit_hmac_key") "stored" (get $stored "mail__escrow__audit_hmac_key") "context" .) | quote }}
{{- end }}
