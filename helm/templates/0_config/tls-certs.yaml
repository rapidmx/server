{{- if eq (include "server.certificateEnabled" $) "true" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.host }}
  namespace: {{ $.Release.Namespace }}
spec:
  secretName: {{ $.Values.host }}-tls-cert
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  subject:
    organizations:
      - RapidMX
  # The use of the common name field has been deprecated since 2000 and is
  # discouraged from being used.
  commonName: {{ $.Values.host }}
  isCA: false
  privateKey:
    algorithm: ECDSA
    encoding: PKCS1
    size: 384
  usages:
    - server auth
    - client auth
  # At least one of a DNS Name, URI, or IP address is required.
  dnsNames:
  - {{ $.Values.host }}
  # Issuer references are always required.
  issuerRef:
    name: letsencrypt-prod
    # We can reference ClusterIssuers by changing the kind here.
    # The default value is Issuer (i.e. a locally namespaced Issuer)
    kind: ClusterIssuer
{{- end }}
{{- $httpsListener := include "server.httpsListener" $ }}
{{- $gatewayNamespace := tpl $.Values.gateway.namespace $ }}
{{- if and $httpsListener (ne (include "server.ownsGateway" $) "true") (ne $gatewayNamespace $.Release.Namespace) }}
---
# A Gateway in another namespace (gateway.namespace) may only use this release's certificate Secret with this grant.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "rrst.fullname" . }}-tls-cert
  namespace: {{ $.Release.Namespace }}
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: {{ $gatewayNamespace }}
  to:
  - group: ""
    kind: Secret
    name: {{ $.Values.host }}-tls-cert
  {{- if include "server.authHttpsListener" $ }}
  - group: ""
    kind: Secret
    name: {{ $.Values.authServer.host }}-tls-cert
  {{- end }}
{{- end }}
