---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "rrst.fullname" . }}-service-config
data:
  NODE_ENV: "{{ $.Values.environment }}"
  {{- $schemes := list "http" }}
  {{- if .Values.global.gateway.tls }}
  {{-   $schemes = ternary (list "https") (list "http" "https") .Values.global.gateway.hsts }}
  {{- end }}
  {{- $hosts := concat (dig "corsHosts" list ($.Values.global | default dict)) (list $.Values.host) }}
  {{- /* The development server's origin is only trusted outside production. */}}
  {{- if ne $.Values.environment "production" }}
  {{-   $hosts = append $hosts "localhost:3000" }}
  {{- end }}
  {{- $origins := list }}
  {{- range $host := $hosts }}
  {{-   range $scheme := $schemes }}
  {{-     $origins = append $origins (printf "%s://%s" $scheme (include "rrst.render" (dict "value" $host "context" $))) }}
  {{-   end }}
  {{- end }}
  cors__origins: {{ $origins | uniq | toJson | quote }}
  trusted_proxies: {{ $.Values.global.trustedProxies | default list | toJson | quote }}
  {{- if .Values.global.openbao.enabled }}
  {{- $openbao := .Values.openbao | default dict }}
  {{- $caFile := ternary "/etc/rapidmx/openbao-ca/ca.crt" "" (ne (include "rrst.vaultCaConfigMap" .) "") }}
  # Where the server's OpenBao client connects: the encryption CA's PKI mount (with mail__pki__backend "openbao"). The CA file is
  # the copy of OpenBao's CA mounted from global.openbao.caConfigMap.
  mail__pki__openbao__address: {{ include "rrst.vaultAddress" $ | quote }}
  {{- with $caFile }}
  mail__pki__openbao__ca_file: {{ . | quote }}
  {{- end }}
  {{- if eq (include "rapidmx.openbaoServerAuth" $) "true" }}
  mail__pki__openbao__auth__method: kubernetes
  mail__pki__openbao__auth__role: {{ include "rrst.render" (dict "value" (dig "auth" "role" "" $openbao) "context" $) | default (printf "%s-server" (include "rrst.fullname" $)) | quote }}
  mail__pki__openbao__auth__mount_path: {{ dig "auth" "mountPath" "kubernetes" $openbao | quote }}
  mail__pki__openbao__auth__token_file: /var/run/secrets/openbao/token
  {{- end }}
  mail__pki__openbao__mount: {{ dig "pki" "mount" "pki" $openbao | quote }}
  mail__pki__openbao__role: {{ dig "pki" "role" "rapidmx-encryption" $openbao | quote }}
  {{- end }}
  # The configuration keyring (restapi's specs/dns_publishing_and_integrations.md, section 5): the pods mount it as a file (service.yaml) and re-read it
  # every minute; a key rotation writes a new ring to the Secret or, with OpenBao, to the vault, which External Secrets syncs into that Secret.
  config_encryption__keyring_file: /etc/rapidmx/config-keyring/keyring.json
  config_encryption__keyring_store__backend: {{ include "rapidmx.configKeyringBackend" $ | quote }}
  {{- if eq (include "rapidmx.configKeyringBackend" $) "openbao" }}
  config_encryption__keyring_store__kv_mount: {{ include "rrst.vaultKvMount" $ | quote }}
  config_encryption__keyring_store__kv_path: {{ include "rapidmx.configKeyringPath" $ | quote }}
  {{- else if eq (include "rapidmx.configKeyringBackend" $) "kubernetes" }}
  config_encryption__keyring_store__secret_name: {{ include "rapidmx.configKeyringSecretName" $ | quote }}
  {{- end }}
  # The pods of this Deployment, which the server lists (with the Diagnostics Role's read access) to wait for the rollout before it encrypts plugin secret settings.
  config_encryption__plugin_secrets__pod_selector: {{ include "rapidmx.serverPodSelector" $ | quote }}
  # The domains this installation is for, which the server creates once when it starts (mail.domains in values.yaml).
  mail__domains: {{ include "rapidmx.seedDomains" $ | quote }}
  {{- if eq (include "rapidmx.dnsPublishingEnabled" $) "true" }}
  # DNS publishing (restapi's specs/dns_publishing_and_integrations.md, 6.3, 6.4 and 7.3): the DNS controller's ServiceAccount, the only caller the
  # server's /internal/dns accepts; what to publish for the deployment's own hosts; and the external-dns image the server tells the controller to run,
  # which is the one the controller is pinned to.
  mail__dns__controller__subject: {{ printf "system:serviceaccount:%s:%s-dns-controller" $.Release.Namespace (include "rrst.fullname" $) | quote }}
  mail__dns__publish__ttl: {{ int $.Values.dns.ttl | quote }}
  mail__dns__publish__external_dns_image: {{ $.Values.dns.externalDns.image | quote }}
  mail__dns__publish__addresses: {{ $.Values.dns.publicAddresses | default list | toJson | quote }}
  mail__dns__publish__hosts: {{ include "rapidmx.dnsPublishHosts" $ | quote }}
  {{- end }}
  {{- with include "rapidmx.dnsBootstrapProvider" $ }}
  # The DNS provider config the installer asked for, created once when the server starts, with the credentials of the Secret mounted below (service.yaml).
  mail__dns__bootstrap_provider: {{ . | quote }}
  mail__dns__bootstrap_credentials_dir: /etc/rapidmx/dns-bootstrap
  {{- end }}
  {{- range $k, $v := $.Values.service.config }}
  {{ $k }}: {{ include "rrst.render" (dict "value" $v "context" $) | quote }}
  {{- end }}
