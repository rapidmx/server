{{- /*
The password of rspamd's controller, the API the server teaches the spam filter through when a user reports a message. Named for
the setting it becomes: the server pod loads this Secret as environment (mail__scan__spam__rspamd__controller_password ->
mail:scan:spam:rspamd:controller_password), and the rspamd pod reads the same key, hashes it with `rspamadm pw` when it starts and
writes the hash into its worker-controller.inc, so both ends are always the same.

The password is generated once and kept, like the cookie and session secrets: an empty mail.rspamd.controller.password gets a
random one on install that later upgrades read back from this Secret. With mail.rspamd.controller.existingSecret a Secret you
manage is used instead and nothing is rendered here.
*/}}
{{- if not .Values.mail.rspamd.controller.existingSecret }}
{{-   include "rapidmx.assertRspamd" . }}
{{-   $name := include "rapidmx.rspamdSecretName" . }}
{{-   $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{-   $stored := (get $existing "data") | default dict }}
{{-   if not .Values.mail.rspamd.controller.password }}
{{-     include "rrst.assertStableSecrets" (dict "missing" (list "mail.rspamd.controller.password") "always" true "context" .) }}
{{-   end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  mail__scan__spam__rspamd__controller_password: {{ include "rrst.persistedSecret" (dict "value" .Values.mail.rspamd.controller.password "stored" (get $stored "mail__scan__spam__rspamd__controller_password") "context" .) | quote }}
{{- end }}
