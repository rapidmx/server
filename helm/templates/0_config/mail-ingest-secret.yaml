{{- if ne (include "rrst.vaultManagedSecrets" .) "true" }}
{{- /*
With global.gateway.tlsTermination: pod the Gateway only passes TLS through (see 3_gateways/service.yaml's TLSRoute): it can't
404 /internal or add the proxy headers the server refuses /internal requests on, so the public internet reaches /internal/mta
and this secret is all that protects it. A short one could be guessed at, so the render fails rather than serve it there. The
server's own minimum (MIN_MAIL_INGEST_SECRET_LENGTH) is only a startup warning, which is why this is checked here.
*/}}
{{- if and (eq (include "rrst.podTLS" .) "true") (lt (len (tpl .Values.mail.ingestSecret .)) 16) }}
{{- fail "global.mailIngestSecret (or mail.ingestSecret) must be at least 16 characters with global.gateway.tlsTermination: pod, where /internal/mta is reachable from the internet and the secret is its only protection. Use a random value, e.g. the output of openssl rand -hex 32, and give postfix-bridge (and ses-bridge) the same one." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrst.fullname" . }}-mail-ingest-secret
type: Opaque
data:
  # Bearer secret authenticating postfix-bridge's calls to this service's /internal/mta routes. mail.ingestSecret defaults
  # to global.mailIngestSecret, which the postfixBridge subchart's ingestSecret uses too; a postfix-bridge installed as its
  # own release must be given the identical value. Required: the render fails when it's empty or the old
  # `ChangeMeIngestSecret` placeholder. Not generated, since postfix-bridge has to be given the same value.
  mail__transport__ingest__secret: {{ include "rrst.requiredSecret" (dict "value" (tpl .Values.mail.ingestSecret .) "name" "global.mailIngestSecret (or mail.ingestSecret)" "defaults" (list "ChangeMeIngestSecret")) | b64enc | quote }}
{{- end }}
