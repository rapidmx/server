---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrst.fullname" . }}-mail-ingest-secret
type: Opaque
data:
  # Bearer secret authenticating the separate `postfix-bridge` chart's calls to this service's
  # /internal/mta routes - that chart is its own Helm release now, so it must be installed with the
  # identical value under its own `mail.ingestSecret`, or authorization fails. Required: the render fails when it's
  # empty or the old `ChangeMeIngestSecret` placeholder. Not generated, since postfix-bridge has to be given the same
  # value.
  mail__transport__ingest__secret: {{ include "server.requiredSecret" (dict "value" (tpl .Values.mail.ingestSecret .) "name" "mail.ingestSecret" "defaults" (list "ChangeMeIngestSecret")) | b64enc | quote }}
