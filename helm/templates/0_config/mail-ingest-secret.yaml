{{- if ne (include "server.vaultManagedSecrets" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rrst.fullname" . }}-mail-ingest-secret
type: Opaque
data:
  # Bearer secret authenticating postfix-bridge's calls to this service's /internal/mta routes. mail.ingestSecret defaults
  # to global.mailIngestSecret, which the postfixBridge subchart's ingestSecret uses too; a postfix-bridge installed as its
  # own release must be given the identical value. Required: the render fails when it's empty or the old
  # `ChangeMeIngestSecret` placeholder. Not generated, since postfix-bridge has to be given the same value.
  mail__transport__ingest__secret: {{ include "server.requiredSecret" (dict "value" (tpl .Values.mail.ingestSecret .) "name" "global.mailIngestSecret (or mail.ingestSecret)" "defaults" (list "ChangeMeIngestSecret")) | b64enc | quote }}
{{- end }}
