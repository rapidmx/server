{{- if $.Values.global.serviceAccount.create }}
---
# The ServiceAccount the server pod runs as (1_deployments/service.yaml). Its reason to exist is AWS IRSA: annotate it
# with eks.amazonaws.com/role-arn and the pod assumes that role, which is how SesMailTransport (mail.transport.provider
# "ses") and the S3 blob backend get credentials. Off by default - without it the pod uses the namespace's "default"
# ServiceAccount, as it always has.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "rrst.serviceAccountName" . }}
  labels:
    {{- include "rrst.labels" . | nindent 4 }}
  {{- with $.Values.global.serviceAccount.annotations }}
  annotations:
    {{- range $key, $value := . }}
    {{ $key }}: {{ tpl (toString $value) $ | quote }}
    {{- end }}
  {{- end }}
{{- end }}
