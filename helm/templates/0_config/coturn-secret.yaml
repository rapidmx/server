{{- /*
The credentials of the bundled coturn (coturn.create), named for the settings they become: the server pod loads this Secret as
environment (mail__videoconf__turn__shared_secret -> the Video Conferencing plugin's mail:videoconf:turn:shared_secret, or
mail__videoconf__turn__username and __credential -> :username and :credential), and coturn reads the same keys, so both ends
are always the same.

coturn.auth.mode "secret" (the default) keeps one shared secret, from which the server makes a credential for each participant
that joins a call; "credential" keeps one user name and password for everyone. The secret or password is generated once and
kept, like the cookie and session secrets: an empty value gets a random one on install that later upgrades read back from this
Secret. With coturn.auth.existingSecret a Secret you manage is used instead and nothing is rendered here.
*/}}
{{- if and (eq (include "rapidmx.coturnEnabled" .) "true") (not .Values.coturn.auth.existingSecret) }}
{{-   include "rapidmx.assertCoturn" . }}
{{-   $mode := include "rapidmx.coturnAuthMode" . }}
{{-   $name := include "rapidmx.coturnSecretName" . }}
{{-   $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{-   $stored := (get $existing "data") | default dict }}
{{-   $chosen := ternary .Values.coturn.auth.sharedSecret .Values.coturn.auth.password (eq $mode "secret") }}
{{-   if not $chosen }}
{{-     include "rrst.assertStableSecrets" (dict "missing" (list (ternary "coturn.auth.sharedSecret" "coturn.auth.password" (eq $mode "secret"))) "always" true "context" .) }}
{{-   end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
data:
  {{- if eq $mode "secret" }}
  mail__videoconf__turn__shared_secret: {{ include "rrst.persistedSecret" (dict "value" .Values.coturn.auth.sharedSecret "stored" (get $stored "mail__videoconf__turn__shared_secret") "context" .) | quote }}
  {{- else }}
  mail__videoconf__turn__username: {{ .Values.coturn.auth.username | toString | b64enc | quote }}
  mail__videoconf__turn__credential: {{ include "rrst.persistedSecret" (dict "value" .Values.coturn.auth.password "stored" (get $stored "mail__videoconf__turn__credential") "context" .) | quote }}
  {{- end }}
{{- end }}
