---
# DKIM keys written by the main service Deployment (1_deployments/service.yaml, FsDkimKeyProvider). The bundled
# postfixBridge's Postfix signs from this same claim (its dkim.storage.existingClaim); a postfix-bridge installed as its
# own release needs dkim.storage.existingClaim set to it too.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-dkim-keys
spec:
  accessModes:
    - {{ .Values.mail.dkim.storage.accessMode }}
  {{- with include "server.pvcStorageClass" (dict "name" (printf "%s-dkim-keys" (include "rrst.fullname" .)) "value" .Values.mail.dkim.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mail.dkim.storage.size }}
{{- if eq .Values.mail.blob.backend "local" }}
---
# LocalFsBlobStore's root - only ever mounted by the main service Deployment. ReadWriteOnce limits the Deployment to
# one replica (see values.yaml's service.replicas); use mail.blob.backend "s3", or a ReadWriteMany storage class, to
# run more. Not created at all with the "s3" backend.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-blob-data
spec:
  accessModes:
    - {{ .Values.mail.blob.storage.accessMode }}
  {{- with include "server.pvcStorageClass" (dict "name" (printf "%s-blob-data" (include "rrst.fullname" .)) "value" .Values.mail.blob.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mail.blob.storage.size }}
{{- end }}
---
# The local encryption CA's key/certificate (mail:pki:local_ca:dir) and the signing-certificate enrollment stores
# (mail:pki:manual_enrollment:store_path, mail:pki:rfc8823:store_dir, mail:pki:openbao:serial_map_path), all under
# /var/lib/rapidmx/pki. Without it the CA key is regenerated whenever a pod is recreated. Same ReadWriteOnce caveat as
# blob-data above.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rrst.fullname" . }}-pki-data
spec:
  accessModes:
    - {{ .Values.mail.pki.storage.accessMode }}
  {{- with include "server.pvcStorageClass" (dict "name" (printf "%s-pki-data" (include "rrst.fullname" .)) "value" .Values.mail.pki.storage.storageClassName "context" .) }}
  {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mail.pki.storage.size }}
