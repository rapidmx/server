{{- /* See auth-server's own 3_gateways/api.yaml doc comment for why this is gated on gateway.create. */}}
{{- $tls := eq (include "server.tlsEnabled" $) "true" }}
{{- if and $.Values.gateway.create (eq "api-gateway" (tpl $.Values.gateway.name $)) (eq $.Release.Namespace (tpl $.Values.gateway.namespace $)) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api-gateway
spec:
  gatewayClassName: nginx
  listeners:
  # No per-listener `hostname:` restriction - this Gateway is shared with the authServer subchart (see
  # values.yaml's authServer.host, a distinct auth.<host> subdomain), so hostname-based routing is left
  # entirely to each HTTPRoute's own `hostnames:` list instead (this chart's own below, and authServer's -
  # both attach to this same "http"/"https" listener via `sectionName`).
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  {{- if $tls }}
  # TLS is terminated on the listener (an HTTPRoute has no `tls` field). The certificates come from tls-certs.yaml's
  # cert-manager Certificate for `host` and, when the auth-server subchart is installed, its own for authServer.host;
  # the Gateway picks one by SNI.
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ $.Values.host }}-tls-cert
      {{- if and $.Values.authServer.create (ne $.Values.authServer.host "localhost") (not (contains ".local" $.Values.authServer.host)) }}
      - kind: Secret
        name: {{ $.Values.authServer.host }}-tls-cert
      {{- end }}
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Chart-name-qualified (not a bare "api-httproute") - see authServer's own identical fix, needed once
  # both charts' HTTPRoutes attach to the one shared Gateway above.
  name: {{ include "rrst.fullname" . }}-httproute
spec:
  parentRefs:
  - name: {{ tpl $.Values.gateway.name $ }}
    namespace: {{ tpl $.Values.gateway.namespace $ }}
    sectionName: {{ ternary "https" "http" $tls }}
  hostnames:
  - {{ $.Values.host | quote }}
  rules:
  # /internal/* (the MTA hand-off API postfix-bridge calls inside the cluster, authenticated by mail.ingestSecret) is
  # never served publicly: a rule with no backendRefs and no filters answers 404. It shares the server's port with the
  # public API, so a NetworkPolicy can't separate the two - this rule and the ingest secret are the protection.
  - matches:
    - path:
        type: PathPrefix
        value: /internal
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
    {{- if not $.Values.gateway.hsts }}
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: NginxHTTPRoute
        name: disable-hsts
    {{- end }}
{{- if $tls }}
---
# Plain HTTP for `host` only redirects to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rrst.fullname" . }}-https-redirect
spec:
  parentRefs:
  - name: {{ tpl $.Values.gateway.name $ }}
    namespace: {{ tpl $.Values.gateway.namespace $ }}
    sectionName: http
  hostnames:
  - {{ $.Values.host | quote }}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
{{- if not $.Values.gateway.hsts }}
---
apiVersion: gateway.nginx.org/v1alpha1
kind: NginxHTTPRoute
metadata:
  name: disable-hsts
spec:
  headers:
    response:
      remove:
      - Strict-Transport-Security
{{- end }}
