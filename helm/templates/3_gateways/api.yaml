{{- /* See auth-server's own 3_gateways/api.yaml doc comment for why this is gated on gateway.create. */}}
{{- $tls := eq (include "server.tlsEnabled" $) "true" }}
{{- $httpsListener := include "server.httpsListener" $ }}
{{- $authHost := (include "rrst.render" (dict "value" $.Values.authServer.host "context" $)) }}
{{- $authHttpsListener := include "server.authHttpsListener" $ }}
{{- $ownsGateway := eq (include "server.ownsGateway" $) "true" }}
{{- include "server.assertAuthServerRouting" $ }}
{{- if $ownsGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api-gateway
spec:
  gatewayClassName: {{ $.Values.gateway.className | quote }}
  listeners:
  # No `hostname:` on the plain HTTP listener - it's shared with the authServer subchart (a distinct auth.<host>
  # subdomain, see values.yaml's authServer.host), whose HTTPRoute attaches to "http" by name; hostname-based routing is
  # left to each HTTPRoute's own `hostnames:` list.
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: All
  {{- if $tls }}
  # TLS is terminated on the listener (an HTTPRoute has no `tls` field), one listener per hostname with that host's own
  # certificate: several certificateRefs on one listener aren't chosen between by SNI, so every host would be served
  # the first one. Routes pick their listener with `sectionName`.
  - name: https
    protocol: HTTPS
    port: 443
    hostname: {{ (include "rrst.render" (dict "value" $.Values.service.host "context" $)) | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ (include "rrst.render" (dict "value" $.Values.service.host "context" $)) }}-tls-cert
    allowedRoutes:
      namespaces:
        from: All
  {{- if $authHttpsListener }}
  # authServer.host, with the certificate the auth-server subchart issues (its tls-certs.yaml).
  - name: https-auth
    protocol: HTTPS
    port: 443
    hostname: {{ $authHost | quote }}
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ $authHost }}-tls-cert
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
  {{- end }}
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Chart-name-qualified (not a bare "api-httproute") - see authServer's own identical fix, needed once
  # both charts' HTTPRoutes attach to the one shared Gateway above.
  name: {{ include "rrst.fullname" . }}-httproute
spec:
  parentRefs:
  - name: {{ tpl $.Values.gateway.name $ }}
    namespace: {{ tpl $.Values.gateway.namespace $ }}
    sectionName: {{ ternary $httpsListener "http" $tls }}
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.service.host "context" $)) | quote }}
  rules:
  # /internal/* (the MTA hand-off API postfix-bridge calls inside the cluster, authenticated by mail.ingestSecret) is
  # never served publicly: a rule with no backendRefs and no filters answers 404. It shares the server's port with the
  # public API, so a NetworkPolicy can't separate the two - this rule and the ingest secret are the protection.
  - matches:
    - path:
        type: PathPrefix
        value: /internal
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
    {{- if not $.Values.gateway.hsts }}
    # Standard Gateway API filter, so it works on any implementation (Envoy Gateway, nginx-gateway-fabric, ...).
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        remove:
        - Strict-Transport-Security
    {{- end }}
{{- if $tls }}
---
# Plain HTTP for `host` only redirects to HTTPS - rendered only when a listener actually serves HTTPS for it (see
# server.tlsEnabled), so a Gateway without one never gets a redirect to nowhere.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rrst.fullname" . }}-https-redirect
spec:
  parentRefs:
  - name: {{ tpl $.Values.gateway.name $ }}
    namespace: {{ tpl $.Values.gateway.namespace $ }}
    sectionName: http
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.service.host "context" $)) | quote }}
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
{{- if $authHttpsListener }}
---
# The auth-server subchart's own HTTPRoute only attaches to the "http" listener, but mail__auth_server_url sends
# browsers to https://<authServer.host> once TLS is on - route that listener to its Service too.
{{- $authName := $.Values.authServer.nameOverride | default "authServer" }}
{{- $authFullname := ternary $.Release.Name (printf "%s-%s" $.Release.Name $authName) (contains $authName $.Release.Name) | trunc 63 | trimSuffix "-" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rrst.fullname" . }}-auth-https
spec:
  parentRefs:
  - name: {{ tpl $.Values.gateway.name $ }}
    namespace: {{ tpl $.Values.gateway.namespace $ }}
    sectionName: {{ $authHttpsListener }}
  hostnames:
  - {{ $authHost | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $.Values.authServer.fullnameOverride | default $authFullname }}-services
      port: 80
{{- end }}
