{{- $ownsGateway := and (eq (printf "%s-gateway" (include "rrst.fullname" .)) (tpl $.Values.global.gateway.name $)) (eq $.Release.Namespace (tpl $.Values.global.gateway.namespace $)) }}
{{- /* Matches tls-certs.yaml: a certificate is only issued for a host that can get one. */}}
{{- $certificate := eq (include "rrst.certificate" $) "true" }}
{{- $podTLS := eq (include "rrst.podTLS" $) "true" }}
{{- if $ownsGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "rrst.fullname" . }}-gateway
spec:
  gatewayClassName: {{ $.Values.global.gateway.className | quote }}
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
    allowedRoutes:
      namespaces:
        from: All
  {{- if $certificate }}
  - name: https
    {{- if $podTLS }}
    # Pod-terminated TLS: this listener only passes bytes through by SNI, it never decrypts - so it takes no
    # certificateRefs, and an HTTPRoute can't attach to it (see the TLSRoute below instead).
    protocol: TLS
    {{- else }}
    # TLS is terminated on the listener; an HTTPRoute has no `tls` field.
    protocol: HTTPS
    {{- end }}
    port: 443
    hostname: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
    tls:
      {{- if $podTLS }}
      mode: Passthrough
      {{- else }}
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
      {{- end }}
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
{{- end }}
{{- if and (not $ownsGateway) $certificate (not $podTLS) }}
---
# The Gateway that terminates TLS for `host` lives in another namespace, so it may only read the certificate Secret in
# this one because this says so.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "rrst.fullname" . }}-tls-cert
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
  to:
  - group: ""
    kind: Secret
    name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Chart-name-qualified (not a bare "api-httproute") so a parent chart depending on this one as a
  # subchart - each with its own hostname/backendRefs attached to one shared Gateway - doesn't have both
  # charts' HTTPRoutes collide under the same literal resource name, silently clobbering one route with
  # the other on every `helm upgrade`.
  name: {{ include "rrst.fullname" . }}-httproute
spec:
  parentRefs:
  {{- if $ownsGateway }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http
  {{- if and (not $podTLS) $certificate }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https
  {{- end }}
  {{- else }}
  # A Gateway this chart doesn't own (global.gateway.name/namespace) has listeners it names itself, so the route names
  # none: it attaches to whichever listeners accept this hostname - the HTTP one and, once it has a certificate for
  # `host`, the HTTPS one.
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
  {{- end }}
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  rules:
  {{- if $podTLS }}
  # The pod only speaks TLS once its ssl config is set (see 1_deployments/service.yaml), so plain HTTP arriving on
  # this listener can no longer be forwarded to it - send it to the https listener instead.
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
  {{- else }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
    {{- if not $.Values.global.gateway.hsts }}
    # Standard Gateway API filter, so it works on any implementation (Envoy Gateway, nginx-gateway-fabric, ...).
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        remove:
        - Strict-Transport-Security
    {{- end }}
  {{- end }}
{{- if $podTLS }}
---
# Passes the raw TLS bytes on to the pod by SNI hostname instead of decrypting them - the pod terminates TLS itself
# (global.gateway.tlsTermination: pod, see 1_deployments/service.yaml's ssl__key/ssl__cert). TLSRoute is still in the
# Gateway API's experimental channel (gateway.networking.k8s.io/v1alpha2): the cluster's Gateway API CRDs need that
# channel installed for this to work. Because Envoy never decrypts this traffic, the HSTS-stripping response-header
# filter above has no equivalent here - global.gateway.hsts only affects the cors__origins scheme list in this mode.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "rrst.fullname" . }}-tlsroute
spec:
  parentRefs:
  {{- if and $ownsGateway $certificate }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https
  {{- end }}
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  rules:
  - backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
{{- end }}
