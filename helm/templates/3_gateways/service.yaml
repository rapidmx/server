{{- $ownsGateway := and (eq (printf "%s-gateway" (include "rrst.fullname" .)) (tpl $.Values.global.gateway.name $)) (eq $.Release.Namespace (tpl $.Values.global.gateway.namespace $)) }}
{{- /* Matches tls-certs.yaml: a certificate is only issued for a host that can get one. */}}
{{- $certificate := eq (include "rrst.certificate" $) "true" }}
{{- $podTLS := eq (include "rrst.podTLS" $) "true" }}
{{- $autodiscoverHost := include "rapidmx.autodiscoverHost" $ }}
{{- /*
Plain HTTP is redirected to HTTPS when this chart owns the Gateway and terminates TLS on it: the http and https listeners are
named here, so the redirect can be attached to the http ones only (a Gateway it doesn't own names its own listeners, which
this can't tell apart). cert-manager's HTTP-01 solver route matches its own /.well-known/acme-challenge/<token> path exactly,
which wins over this route's `/` prefix, so certificates are still issued over HTTP.
*/}}
{{- $redirectHTTP := and $ownsGateway $certificate (not $podTLS) $.Values.global.gateway.httpRedirect }}
{{- if $ownsGateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "rrst.fullname" . }}-gateway
spec:
  gatewayClassName: {{ $.Values.global.gateway.className | quote }}
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    hostname: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
    allowedRoutes:
      namespaces:
        from: All
  # Mail clients' Autodiscover probe reaches this server on this fixed name regardless of `host` (see tls-certs.yaml,
  # which covers it on the same certificate as `host`).
  - name: http-autodiscover
    port: 80
    protocol: HTTP
    hostname: {{ $autodiscoverHost | quote }}
    allowedRoutes:
      namespaces:
        from: All
  {{- if $certificate }}
  - name: https
    {{- if $podTLS }}
    # Pod-terminated TLS: this listener only passes bytes through by SNI, it never decrypts - so it takes no
    # certificateRefs, and an HTTPRoute can't attach to it (see the TLSRoute below instead).
    protocol: TLS
    {{- else }}
    # TLS is terminated on the listener; an HTTPRoute has no `tls` field.
    protocol: HTTPS
    {{- end }}
    port: 443
    hostname: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
    tls:
      {{- if $podTLS }}
      mode: Passthrough
      {{- else }}
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
      {{- end }}
    allowedRoutes:
      namespaces:
        from: All
  - name: https-autodiscover
    {{- if $podTLS }}
    protocol: TLS
    {{- else }}
    protocol: HTTPS
    {{- end }}
    port: 443
    hostname: {{ $autodiscoverHost | quote }}
    tls:
      {{- if $podTLS }}
      mode: Passthrough
      {{- else }}
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
      {{- end }}
    allowedRoutes:
      namespaces:
        from: All
  {{- end }}
{{- end }}
{{- if and (not $ownsGateway) $certificate (not $podTLS) }}
---
# The Gateway that terminates TLS for `host` lives in another namespace, so it may only read the certificate Secret in
# this one because this says so.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ include "rrst.fullname" . }}-tls-cert
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
  to:
  - group: ""
    kind: Secret
    name: {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) }}-tls-cert
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Chart-name-qualified (not a bare "api-httproute") so a parent chart depending on this one as a
  # subchart - each with its own hostname/backendRefs attached to one shared Gateway - doesn't have both
  # charts' HTTPRoutes collide under the same literal resource name, silently clobbering one route with
  # the other on every `helm upgrade`.
  name: {{ include "rrst.fullname" . }}-httproute
spec:
  parentRefs:
  {{- if $ownsGateway }}
  {{- if not $redirectHTTP }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http-autodiscover
  {{- end }}
  {{- if and (not $podTLS) $certificate }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https-autodiscover
  {{- end }}
  {{- else }}
  # A Gateway this chart doesn't own (global.gateway.name/namespace) has listeners it names itself, so the route names
  # none: it attaches to whichever listeners accept this hostname - the HTTP one and, once it has a certificate for
  # `host`, the HTTPS one.
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
  {{- end }}
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  - {{ $autodiscoverHost | quote }}
  rules:
  # /internal/* (the MTA hand-off API postfix-bridge calls inside the cluster, authenticated by mail.ingestSecret) is
  # never served publicly: a rule with no backendRefs and no filters answers 404. It shares the server's port with the
  # public API, so a NetworkPolicy can't separate the two - this rule, the server's own refusal of /internal requests
  # that arrive through a proxy (see InternalCallerGuard) and the ingest secret are the protection.
  - matches:
    - path:
        type: PathPrefix
        value: /internal
  {{- if $podTLS }}
  # The pod only speaks TLS once its ssl config is set (see 1_deployments/service.yaml), so plain HTTP arriving on
  # this listener can no longer be forwarded to it - send it to the https listener instead.
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
  {{- else }}
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
    # Baseline security response headers for every served response (the app's HTML shell, the static bundles and the API).
    # A standard Gateway API filter, so it works on any implementation (Envoy Gateway, nginx-gateway-fabric, ...). In
    # tlsTermination: pod mode the gateway only passes TLS bytes through and cannot add these (see the TLSRoute below); the
    # pod has to set them itself there.
    filters:
    - type: ResponseHeaderModifier
      responseHeaderModifier:
        set:
        # Stops a browser from MIME-sniffing a response into a type it wasn't sent as (e.g. treating a text body as a script).
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: strict-origin-when-cross-origin
        {{- if $.Values.global.gateway.hsts }}
        # HTTPS is enforced for two years. `host` has no sub-names of its own, so includeSubDomains costs nothing here and is
        # kept for when it does. `preload` is deliberately not set: that submits the name to browsers' preload list, which is
        # slow to undo, so it's left to the operator.
        - name: Strict-Transport-Security
          value: max-age=63072000; includeSubDomains
        {{- end }}
        add:
        # Added, not set, so it layers with - never replaces - the stricter `default-src 'none'; sandbox` CSP the app already
        # sends on the routes that render untrusted content (attachments, message bodies, branding); a browser enforces every
        # CSP it receives, so the most restrictive one still wins on those routes. `frame-ancestors 'self'` blocks cross-origin
        # framing (clickjacking) while still letting the reading pane frame its own same-origin `/messages/:id/content`; a blunt
        # `X-Frame-Options: DENY` would break that same-origin iframe, so it is deliberately not used. A `script-src` policy is
        # not set here: it needs per-response nonces threaded through the SSR shell (a separate change), and an un-nonced
        # `script-src` would break the app.
        - name: Content-Security-Policy
          value: "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
        {{- if not $.Values.global.gateway.hsts }}
        remove:
        - Strict-Transport-Security
        {{- end }}
  {{- end }}
{{- if $redirectHTTP }}
---
# Sends everything arriving over plain HTTP to the same address over HTTPS. The API route above is attached to the https
# listeners only, so no request is served in the clear (global.gateway.httpRedirect: false serves both).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "rrst.fullname" . }}-httproute-redirect
spec:
  parentRefs:
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ tpl $.Values.global.gateway.namespace $ }}
    sectionName: http-autodiscover
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  - {{ $autodiscoverHost | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}
{{- if $podTLS }}
---
# Passes the raw TLS bytes on to the pod by SNI hostname instead of decrypting them - the pod terminates TLS itself
# (global.gateway.tlsTermination: pod, see 1_deployments/service.yaml's ssl__key/ssl__cert). TLSRoute is still in the
# Gateway API's experimental channel (gateway.networking.k8s.io/v1alpha2): the cluster's Gateway API CRDs need that
# channel installed for this to work. Because Envoy never decrypts this traffic, the HSTS-stripping response-header
# filter above has no equivalent here - global.gateway.hsts only affects the cors__origins scheme list in this mode.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: {{ include "rrst.fullname" . }}-tlsroute
spec:
  parentRefs:
  {{- if and $ownsGateway $certificate }}
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https
  - name: {{ tpl $.Values.global.gateway.name $ }}
    namespace: {{ $.Release.Namespace }}
    sectionName: https-autodiscover
  {{- end }}
  hostnames:
  - {{ (include "rrst.render" (dict "value" $.Values.host "context" $)) | quote }}
  - {{ $autodiscoverHost | quote }}
  rules:
  - backendRefs:
    - name: {{ include "rrst.fullname" . }}-services
      port: 80
{{- end }}
