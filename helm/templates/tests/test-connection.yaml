apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "rrst.fullname" . }}-test-connection"
  labels:
{{ include "rrst.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  # Only talks to the Service: it needs no Kubernetes API token.
  automountServiceAccountToken: false
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: {{ .Values.service.probeImage }}
      command: ['wget']
      args:  ['{{ include "rrst.fullname" . }}-services']
  restartPolicy: Never
