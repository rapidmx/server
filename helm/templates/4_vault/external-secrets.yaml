{{- if eq (include "rrst.vaultManagedSecrets" .) "true" }}
{{- $fullname := include "rrst.fullname" . }}
{{- $api := include "rrst.externalSecretsApiVersion" . }}
{{- $store := printf "%s-openbao" $fullname }}
{{- $path := include "rrst.vaultSecretsPath" . }}
---
# External Secrets reads this deployment's secrets out of OpenBao and keeps them in the Kubernetes Secrets the pod
# already loads, so the application needs no vault client. As a subchart of the RapidMX server, the path and token come
# from that release (global.openbao), which is how both charts end up signing and verifying with the same JWT secret.
apiVersion: {{ $api }}
kind: SecretStore
metadata:
  name: {{ $store }}
spec:
  provider:
    vault:
      server: {{ include "rrst.vaultAddress" . | quote }}
      path: {{ include "rrst.vaultKvMount" . | quote }}
      version: v2
      auth:
        {{- include "rrst.vaultAuth" . | nindent 8 }}
---
# The JWT signing secret, and the claims that go with it.
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-jwt-auth
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: {{ $fullname }}-jwt-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth__secret: "{{ `{{ .auth_secret }}` }}"
        auth__options__audience: {{ include "rrst.render" (dict "value" $.Values.global.jwt.audience "context" $) | quote }}
        auth__options__issuer: {{ include "rrst.render" (dict "value" $.Values.global.jwt.issuer "context" $) | quote }}
        auth__options__expiresIn: {{ include "rrst.render" (dict "value" $.Values.global.jwt.expiresIn "context" $) | quote }}
  data:
    - secretKey: auth_secret
      remoteRef:
        key: {{ $path }}
        property: auth_secret
---
# Cookie and session signing secrets (the service-secrets Secret this chart renders when the vault is off).
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-service-secrets
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $store }}
    kind: SecretStore
  target:
    name: {{ $fullname }}-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: cookie_secret
      remoteRef:
        key: {{ $path }}
        property: cookie_secret
    - secretKey: session__secret
      remoteRef:
        key: {{ $path }}
        property: session__secret
{{- end }}
