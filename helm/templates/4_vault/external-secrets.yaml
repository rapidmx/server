{{- if eq (include "server.vaultManagedSecrets" .) "true" }}
{{- $fullname := include "rrst.fullname" . }}
{{- $api := include "server.externalSecretsApiVersion" . }}
{{- $secretsPath := include "server.vaultSecretsPath" . }}
---
# External Secrets reads this release's secrets out of OpenBao and keeps them in the Kubernetes Secrets the pods already
# load - so nothing in the application changes, and OpenBao stays the place the values actually live. The token is the
# read-only one the vault's init Job minted for this release (openbao.yaml).
apiVersion: {{ $api }}
kind: SecretStore
metadata:
  name: {{ $fullname }}-openbao
spec:
  provider:
    vault:
      server: {{ include "server.openbaoAddress" . | quote }}
      path: {{ include "server.vaultKvMount" . | quote }}
      version: v2
      auth:
        {{- include "server.vaultAuth" . | nindent 8 }}
---
# Cookie, session and escrow audit signing secrets (the service-secrets Secret this chart renders when OpenBao is off).
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-service-secrets
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $fullname }}-openbao
    kind: SecretStore
  target:
    name: {{ $fullname }}-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: cookie_secret
      remoteRef:
        key: {{ $secretsPath }}
        property: cookie_secret
    - secretKey: session__secret
      remoteRef:
        key: {{ $secretsPath }}
        property: session__secret
    # Keys the escrow audit log's hash chain: entries chained under an old key stop verifying, which is exactly why it
    # is written once in OpenBao and never regenerated.
    - secretKey: mail__escrow__audit_hmac_key
      remoteRef:
        key: {{ $secretsPath }}
        property: escrow_audit_hmac_key
---
# The JWT secret, and the claims that go with it. The bundled auth-server reads the same OpenBao path (through
# global.openbao below), so both sides sign and verify with the same value without anyone passing it in.
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-jwt-auth
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $fullname }}-openbao
    kind: SecretStore
  target:
    name: {{ $fullname }}-jwt-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        auth__secret: "{{ `{{ .auth_secret }}` }}"
        auth__options__audience: {{ tpl $.Values.auth.audience $ | quote }}
        auth__options__issuer: {{ tpl $.Values.auth.issuer $ | quote }}
        auth__options__expiresIn: {{ tpl $.Values.auth.expiresIn $ | quote }}
  data:
    - secretKey: auth_secret
      remoteRef:
        key: {{ $secretsPath }}
        property: auth_secret
---
# The bearer secret postfix-bridge (or ses-bridge) authenticates to /internal/mta with. The bundled postfix-bridge reads
# the same Secret, so both ends stay in step.
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-mail-ingest-secret
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $fullname }}-openbao
    kind: SecretStore
  target:
    name: {{ $fullname }}-mail-ingest-secret
    creationPolicy: Owner
  data:
    - secretKey: mail__transport__ingest__secret
      remoteRef:
        key: {{ $secretsPath }}
        property: mail_ingest_secret
{{- end }}
