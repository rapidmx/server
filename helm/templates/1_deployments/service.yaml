{{- /*
Every ReadWriteOnce volume the server mounts can only be attached to one node, so more than one replica needs
ReadWriteMany storage (or, for message storage, the "s3" blob backend). Fail the render with an explanation rather
than leaving extra pods stuck in ContainerCreating on a Multi-Attach error.
*/}}
{{- $rwoVolumes := list }}
{{- if and (eq $.Values.mail.blob.backend "local") (ne $.Values.mail.blob.storage.accessMode "ReadWriteMany") }}
{{- $rwoVolumes = append $rwoVolumes "mail.blob.storage" }}
{{- end }}
{{- if ne $.Values.mail.dkim.storage.accessMode "ReadWriteMany" }}
{{- $rwoVolumes = append $rwoVolumes "mail.dkim.storage" }}
{{- end }}
{{- if ne $.Values.mail.pki.storage.accessMode "ReadWriteMany" }}
{{- $rwoVolumes = append $rwoVolumes "mail.pki.storage" }}
{{- end }}
{{- if and $.Values.mongodb.create $.Values.postgresql.create }}
{{- fail "mongodb.create and postgresql.create are both true, but the server runs against exactly one database: set one of them to false." }}
{{- end }}
{{- if and (gt (int $.Values.service.replicas) 1) $rwoVolumes }}
{{- fail (printf "service.replicas is %d, but %s use ReadWriteOnce storage, which only one pod can mount. Set their accessMode to ReadWriteMany (with a storage class that supports it) - and mail.blob.backend to \"s3\" instead, if you prefer - or set service.replicas to 1." (int $.Values.service.replicas) (join ", " $rwoVolumes)) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rrst.fullname" . }}-services
  labels:
    app: {{ include "rrst.name" . }}
    app.kubernetes.io/instance: {{ include "rrst.fullname" . }}-services
    environment: {{ $.Values.environment }}
spec:
  replicas: {{ $.Values.service.replicas }}
  {{- if $rwoVolumes }}
  # A ReadWriteOnce volume can't be attached to the new pod while the old one still holds it (on another node), so a
  # rolling update would hang; stop the old pod first.
  strategy:
    type: Recreate
    # Explicitly cleared: an upgrade from a release that used the default RollingUpdate strategy would otherwise keep
    # the live object's rollingUpdate settings, which the API server rejects together with Recreate.
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "rrst.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "rrst.name" . }}
        app.kubernetes.io/instance: {{ include "rrst.fullname" . }}-services
        environment: {{ $.Values.environment }}
      annotations:
        # No prometheus.io/scrape annotations: /api/metrics requires a token with a trusted role
        # (service.config.metrics__authRequired), which annotation-based discovery can't send - configure a scrape job
        # (or ServiceMonitor) with a bearer token for path /api/metrics on port 3000 instead.
        # Roll the pods when their configuration or secrets change - they're only read at startup. service-config.yaml
        # includes the service-db-info Secret; the database passwords themselves come from the subcharts' Secrets.
        checksum/config: {{ include (print $.Template.BasePath "/0_config/service-config.yaml") . | sha256sum }}
        checksum/secrets: {{ print (include (print $.Template.BasePath "/0_config/jwt-auth.yaml") .) (include (print $.Template.BasePath "/0_config/mail-ingest-secret.yaml") .) (include (print $.Template.BasePath "/0_config/service-secrets.yaml") .) (include (print $.Template.BasePath "/0_config/redis.yaml") .) | sha256sum }}
    spec:
      {{- if $.Values.service.imagePullSecret }}
      imagePullSecrets:
        - name: {{ $.Values.service.imagePullSecret }}
      {{- end }}
      # preStop sleep + the server's own drain (config shutdown.drain_delay_ms) + its stop timeout (shutdown.timeout_ms)
      # must fit in this.
      terminationGracePeriodSeconds: {{ $.Values.service.terminationGracePeriodSeconds }}
      {{- with $.Values.service.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "rrst.name" . }}
          image: {{ $.Values.service.image.registry }}/{{ $.Values.service.image.repository }}:{{ $.Values.service.image.tag | default $.Chart.AppVersion }}
          {{- if eq ($.Values.service.image.tag | default $.Chart.AppVersion) "latest" }}
          imagePullPolicy: Always
          {{- else }}
          imagePullPolicy: IfNotPresent
          {{- end }}
          {{- /*
          @rapidmx/server has separate, statically-imported entry points for each datastore backend
          (server.mongo.ts/server.sql.ts) rather than one script that branches on env vars at runtime -
          the image's own default CMD (dist/src/server.js) is hardwired to Mongo, so this must be
          selected explicitly here or a postgresql.create:true install would silently run against Mongo
          config regardless of every datastore env var service-config.yaml/service-db-info correctly set
          for Postgres - see docker-compose.mongo.yml/sql.yml's own identical fix.
          */}}
          {{- $entrypoint := ternary "dist/src/server.sql.js" "dist/src/server.mongo.js" $.Values.postgresql.create }}
          {{- /*
          `args` only, never `command`: `command` replaces the image's ENTRYPOINT (scripts/docker-entrypoint.sh), which
          writes the msmtp config PostfixSendmailTransport relays outbound mail through - without it every send fails.
          */}}
          {{- if ne $.Values.environment "production" }}
          args: ["node", "--inspect=127.0.0.1:9229", {{ $entrypoint | quote }}]
          {{- else }}
          args: ["node", {{ $entrypoint | quote }}]
          {{- end }}
          {{- with $.Values.service.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "rrst.fullname" . }}-service-config
            {{- if $.Values.redis.create }}
            - secretRef:
                name: db-redis-info
            {{- end }}
            - secretRef:
                name: {{ include "rrst.fullname" . }}-jwt-auth
            - secretRef:
                name: {{ include "rrst.fullname" . }}-service-db-info
            - secretRef:
                name: {{ include "rrst.fullname" . }}-mail-ingest-secret
            - secretRef:
                name: {{ .Values.secrets.existingSecret | default (printf "%s-service-secrets" (include "rrst.fullname" .)) }}
          env:
            # Outbound relay (scripts/docker-entrypoint.sh writes ~/.msmtprc from these) - see values.yaml's mail.relay.
            - name: SENDMAIL_RELAY_HOST
              value: {{ tpl $.Values.mail.relay.host $ | quote }}
            - name: SENDMAIL_RELAY_PORT
              value: {{ $.Values.mail.relay.port | toString | quote }}
            - name: SENDMAIL_RELAY_TLS
              value: {{ ternary "on" "off" (has (toString $.Values.mail.relay.tls) (list "true" "on")) | quote }}
            - name: SENDMAIL_FROM_ADDRESS
              value: {{ tpl $.Values.mail.relay.fromAddress $ | default (printf "mailer@%s" ($.Values.mail.mxHostname | default $.Values.host)) | quote }}
            {{- include "server.datastoreEnv" . | trim | nindent 12 }}
          ports:
            - containerPort: 3000
          # Plugin changes restart the server process inside the container, one pod at a time (see
          # src/plugins/PluginWatcher.ts). A pod mid-restart fails this probe and leaves the Service until it's
          # serving again, so the other replica takes its traffic.
          readinessProbe:
            httpGet:
              path: /api/status
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          {{- with $.Values.service.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.service.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $.Values.service.preStopSleepSeconds }}
          # Keeps serving while the endpoint is removed from the Service and the Gateway, before SIGTERM starts the
          # server's own drain and stop.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", {{ $.Values.service.preStopSleepSeconds | toString | quote }}]
          {{- end }}
          resources:
            {{- toYaml $.Values.service.resources | nindent 12 }}
          volumeMounts:
            # FsDkimKeyProvider (mail__dkim__key_dir) writes here. The separate `postfix-bridge` chart's
            # own Postfix Deployment mounts its own PVC at the exact same path for rspamd's dkim_signing
            # module to read from - since that's a different Helm release, share the underlying storage
            # between the two charts (see mail-storage.yaml's own doc comment) rather than relying on one
            # PVC - see values.yaml's mail.dkim.storage doc comment for the ReadWriteOnce/ReadWriteMany
            # tradeoff.
            - name: dkim-keys
              mountPath: /var/lib/rspamd/dkim
            {{- if eq $.Values.mail.blob.backend "local" }}
            # LocalFsBlobStore's root (mail:blob:local:root, ./data/blobs relative to /app) - raw MIME
            # sources, attachments, contact photos.
            - name: blob-data
              mountPath: /app/data
            {{- end }}
            # The local encryption CA and signing-certificate enrollment state (mail:pki:*).
            - name: pki-data
              mountPath: /var/lib/rapidmx/pki
            # Where the plugin host npm-installs plugins at startup. Per pod and disposable: each pod reinstalls
            # the plugin set recorded in the database when it starts.
            - name: plugins
              mountPath: /app/plugins
      volumes:
        - name: plugins
          emptyDir: {}
        - name: dkim-keys
          persistentVolumeClaim:
            claimName: {{ include "rrst.fullname" . }}-dkim-keys
        {{- if eq $.Values.mail.blob.backend "local" }}
        - name: blob-data
          persistentVolumeClaim:
            claimName: {{ include "rrst.fullname" . }}-blob-data
        {{- end }}
        - name: pki-data
          persistentVolumeClaim:
            claimName: {{ include "rrst.fullname" . }}-pki-data
      initContainers:
        {{- if $.Values.redis.create }}
        {{- $redisHost := tpl $.Values.redis.url . | replace "redis://" "" }}
        - name: redis-probe
          image: busybox
          {{- with $.Values.service.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: REDIS_HOST
              value: {{ $redisHost }}
          # A bare TCP check, not an authenticated PING: this only needs to confirm the datastore is
          # reachable before the app starts, and avoids having to parse the password (see redis.yaml) back
          # out of a URL here too.
          command: ['sh', '-c', "until nc -z $REDIS_HOST 6379; do echo waiting for cache; sleep $(expr 2 + $RANDOM % 13); done"]
        {{- end }}
        {{- if $.Values.mongodb.create }}
        - name: mongo-probe
          image: busybox
          {{- with $.Values.service.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MONGO_HOST
              value: {{ $.Values.mongodb.fullnameOverride }}
          command: ['sh', '-c', "until nc -z $MONGO_HOST 27017; do echo waiting for mongodb; sleep $(expr 2 + $RANDOM % 13); done"]
        {{- end }}
        {{- if $.Values.postgresql.create }}
        - name: postgres-probe
          image: busybox
          {{- with $.Values.service.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POSTGRES_HOST
              value: {{ $.Values.postgresql.fullnameOverride }}
          command: ['sh', '-c', "until nc -z $POSTGRES_HOST 5432; do echo waiting for postgresql; sleep $(expr 2 + $RANDOM % 13); done"]
        {{- end }}
      {{- if $.Values.service.spec }}
      {{- range $k, $v := $.Values.service.spec }}
      {{- if kindIs "string" $v }}
      {{ $k }}: {{ tpl $v $ | quote }}
      {{- else }}
      {{ $k }}: {{ $v }}
      {{- end }}
      {{- end }}
      {{- end }}
