include:
    # Rspamd + ClamAV — the spam/AV scanning stack this service hands inbound mail off to. Folded in via
    # `include` (not a second `-f` flag) so `docker compose -f docker-compose.mongo.yml up` alone brings up
    # a fully working deployment — see .claude/NOTES.md for the end-to-end wiring notes. Postfix/mta-bridge
    # (real inbound/outbound MTA) live in the separate `postfix-bridge` repo's own compose stack now — run
    # it alongside this one, not instead of it. See this repo's README for how the two are wired together.
    - docker-compose.mail.yml

services:
    server:
        image: rapidmx-server:local
        build:
            context: .
        command: ["node", "dist/src/server.mongo.js"]
        # Bound to the host's loopback only: this stack is for local evaluation (NODE_ENV=dev, publicly-known default
        # secrets unless overridden - see README), so it must not be reachable from the network. Put a reverse proxy in
        # front, or change the binding, only after setting real secrets and NODE_ENV=production.
        ports:
            - "127.0.0.1:3000:3000"
        environment:
            - datastores__acl__url=mongodb://mongo
            - datastores__acl__database=${SERVER_ACL_DB_NAME:-rapidmx_server_acls}
            - datastores__cache__type=redis
            - datastores__cache__url=redis://redis/0
            - datastores__events__type=redis
            - datastores__events__url=redis://redis/0
            - datastores__logs__type=redis
            - datastores__logs__url=redis://redis/0
            - datastores__mongo__url=mongodb://mongo
            - datastores__mongo__database=${SERVER_MONGO_DB_NAME:-rapidmx_server_mongo}
            # Must match auth-server's own `auth__secret`/`auth__options__*` below exactly, or every JWT
            # auth-server issues fails signature/audience/issuer verification here. See .claude/NOTES.md
            # ("Authentication is out of scope for this repo") for why this service never issues its own.
            - auth__secret=${AUTH_SECRET:-MyPasswordIsSecure}
            - auth__options__audience=${AUTH_AUDIENCE:-mydomain.com}
            - auth__options__issuer=${AUTH_ISSUER:-api.mydomain.com}
            - cookie_secret=${COOKIE_SECRET:-f0fLSKFJLKWJFe09f32joff098u2fOFIWJ32890fnfnlak}
            # Browser-facing: apps/www's/apps/admin's unauthenticated-redirect and this service's own SSR
            # both resolve auth-server through this URL, so it must be reachable from the visitor's browser,
            # not just from inside the compose network (hence localhost:3001, not http://auth-server:3000).
            # Override with the real public auth-server URL in any deployment that isn't single-host/dev.
            - mail__auth_server_url=${AUTH_SERVER_PUBLIC_URL:-http://localhost:3001}
            # Links in booking emails, and the base URL the autodiscover plugin advertises (it only accepts https://,
            # so autodiscover stays off until PUBLIC_URL is a real https URL).
            - mail__booking__public_url=${PUBLIC_URL:-http://localhost:3000}/book
            - mail__autodiscover__public_url=${PUBLIC_URL:-http://localhost:3000}
            # This deployment's public MX hostname (Reporting-UA of outgoing read receipts, DNS setup checks).
            - mail__dns__mx_hostname=${MX_HOSTNAME:-localhost}
            - NODE_ENV=${NODE_ENV:-dev}
            # The next three vars, and the dkim_rspamd_keys volume/rspamd/clamav links/depends_on below,
            # wire this service up to docker-compose.mail.yml's scanning stack (included above) - see that
            # file's own `server:` comment for why they live here instead of there.
            - mail__scan__spam__rspamd__url=http://rspamd:11333
            - mail__scan__av__clamav__host=clamav
            - mail__scan__av__clamav__port=3310
            # Authenticates the separate `postfix-bridge` repo's calls to this app's `/internal/mta` routes
            # - must match that stack's own MTA_INGEST_SECRET exactly.
            - mail__transport__ingest__secret=${MAIL_INGEST_SECRET:-ChangeMeIngestSecret}
            # `PostfixSendmailTransport`'s outbound relay target (see scripts/docker-entrypoint.sh) - the
            # `postfix-bridge` repo's own Postfix now lives in a separate `docker compose` project, so its
            # `postfix` service name doesn't resolve from this container the way it did when both lived in
            # this same compose project; `host.docker.internal` reaches whatever that stack publishes on
            # the host's own port 25 (its `postfix` service's `ports: - "25:25"`). Override for anything
            # beyond local, single-host evaluation.
            - SENDMAIL_RELAY_HOST=${SENDMAIL_RELAY_HOST:-host.docker.internal}
        volumes:
            # `mail:blob:local:root` (./data/blobs, relative to /app) — raw MIME sources, attachments,
            # contact photos. Must be persistent in any real deployment or every message body/attachment
            # is lost on container recreation.
            - blob_data:/app/data
            # The registered `DkimKeyProvider` (`FsDkimKeyProvider` — see server.mongo.ts) writes each
            # `Domain`'s generated private key directly into rspamd's own live signing directory on this
            # volume, at the exact `<domain>.<selector>.key` path rspamd expects (mail:dkim:key_dir,
            # defaulting to /var/lib/rspamd/dkim). The separate `postfix-bridge` repo's own Postfix
            # (rspamd's dkim_signing module) reads from the identically-named volume in its own compose
            # project - these are two distinct named volumes today (Compose scopes volumes per project), so
            # for anything beyond local single-host evaluation, point both stacks at the same underlying
            # storage (e.g. a shared bind mount, or a Docker volume driver backed by shared storage).
            - dkim_rspamd_keys:/var/lib/rspamd/dkim
            # The local encryption CA's key/certificate and the signing-certificate enrollment stores
            # (mail:pki:local_ca:dir etc.) - lost on container recreation without a volume.
            - pki_data:/var/lib/rapidmx/pki
        links:
            - redis
            - mongo
            - auth-server
            - rspamd
            - clamav
        depends_on:
            - auth-server
            - rspamd
            - clamav
    auth-server:
        image: ghcr.io/rapidrest/auth-server:${AUTH_SERVER_IMAGE_TAG:-latest}
        command: ["node", "dist/src/server.mongo.js"]
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - datastores__acl__url=mongodb://mongo
            - datastores__acl__database=${AUTH_SERVER_ACL_DB_NAME:-rapidmx_auth_acls}
            - datastores__cache__type=redis
            - datastores__cache__url=redis://redis/1
            - datastores__events__type=redis
            - datastores__events__url=redis://redis/1
            - datastores__logs__type=redis
            - datastores__logs__url=redis://redis/1
            - datastores__mongo__url=mongodb://mongo
            - datastores__mongo__database=${AUTH_SERVER_MONGO_DB_NAME:-rapidmx_auth_mongo}
            - auth__secret=${AUTH_SECRET:-MyPasswordIsSecure}
            - auth__options__audience=${AUTH_AUDIENCE:-mydomain.com}
            - auth__options__issuer=${AUTH_ISSUER:-api.mydomain.com}
            # auth-server's own OAuth-authorization-server issuer/origin (distinct from the JWT
            # audience/issuer pair above — see auth-server's own config.mongo.ts) — its public URL too.
            - auth__oauth_server__issuer=${AUTH_SERVER_PUBLIC_URL:-http://localhost:3001}
            - auth__oauth_server__keys__encryption_key=${AUTH_OAUTH_SERVER_ENCRYPTION_KEY:-96aa4879e304e525b74141bf1bc072c17e2b90c5b35250a2d18cbd2b8d4172ac}
            - session__secret=${SESSION_SECRET:-SessionsHaveSecrets}
            - cookie_secret=${COOKIE_SECRET:-f0fLSKFJLKWJFe09f32joff098u2fOFIWJ32890fnfnlak}
            - NODE_ENV=${NODE_ENV:-dev}
        links:
            - redis
            - mongo
    redis:
        image: redis
    mongo:
        image: mongo
        volumes:
            - mongo_data:/data/db

volumes:
    blob_data:
    mongo_data:
    dkim_rspamd_keys:
    pki_data:
